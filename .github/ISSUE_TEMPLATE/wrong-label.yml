name: "Wrong label"
description: "Tell us that laya-triage put the wrong label on an issue or pull request"
title: "[Wrong label]: "
body:
  - type: "markdown"
    attributes:
      value: "laya-triage reads every new issue and labels it as a bug, feature request, question or documentation problem. When it gets one wrong, tell us here. These reports are the most useful data for the next model, so please open one per mislabeled issue."

  - type: "input"
    id: "issue-title"
    attributes:
      label: "Title of the issue that was mislabeled"
      description: "The exact title laya-triage read, without the repository name."
      placeholder: "Editor freezes for 30 seconds when exporting a PDF"
    validations:
      required: true

  - type: "textarea"
    id: "issue-body"
    attributes:
      label: "Body of the issue that was mislabeled, or a link to it"
      description: "Paste the body as it was written, or a link to the issue if it is long. This is the text the model classified, so please do not edit it."
      placeholder: "Exporting a PDF with images freezes the editor for 30 seconds. Steps to reproduce are in the issue."
    validations:
      required: true

  - type: "input"
    id: "added-label"
    attributes:
      label: "Label laya-triage added"
      description: "The exact label name the action applied, as it appears in the issue sidebar."
      placeholder: "enhancement"
    validations:
      required: true

  - type: "input"
    id: "expected-label"
    attributes:
      label: "Label you expected"
      description: "The label that should have been applied. By default laya-triage uses bug, enhancement, question and documentation, but it reuses your own label names when you already have them, so write the name you use."
      placeholder: "bug"
    validations:
      required: true

  - type: "markdown"
    attributes:
      value: "The model version that made the decision is in the workflow run log for the issue. If the issue was labeled by a previous run, mention it here."
