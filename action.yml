name: "Laya Triage"
description: "Free, local AI triage for GitHub issues with a fine-tuned Laya model. No API key, no external service"
branding:
  icon: "tag"
  color: "purple"

inputs:
  mode:
    description: "Use 'triage' to classify new issues and pull requests, 'backlog' to classify the open issues that have no type label yet, or 'warm-cache' to download the models and save them in the cache"
    required: false
    default: "triage"
  github-token:
    description: "Token used to add labels and comments"
    required: false
    default: ${{ github.token }}
  dry-run:
    description: "When 'true', only print the decisions without changing the issue or pull request. Set it to 'false' to apply labels and comments"
    required: false
    default: "true"
  spam-check:
    description: "Experimental. When 'true', pull requests are checked for low-effort spam. Off by default because it still misses most spam"
    required: false
    default: "false"
  class-priors:
    description: "How common each issue type is in your repository. 'auto' counts the issues you labeled in the last year, 'natural' uses the typical GitHub mix, or give your own, like 'bug=0.5,feature=0.3,question=0.15,docs=0.05'"
    required: false
    default: "auto"
  labels:
    description: "Label names to use. 'auto' reuses your existing labels (for example 'type: bug' or 'kind/feature'), or map them yourself, like 'bug=type: bug,feature=feature request'"
    required: false
    default: "auto"
  backlog-limit:
    description: "In 'backlog' mode, the maximum number of open issues to classify, newest first (up to 500)"
    required: false
    default: "100"
  repo-memory:
    description: "Experimental. When 'true', uncertain decisions also look at the most similar closed issues of your repository. Set it in both the triage and the warm-cache workflows"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      id: python
      with:
        python-version: "3.12"

    - if: inputs.mode == 'warm-cache'
      id: venv-save
      uses: actions/cache@v6
      with:
        path: ~/laya-venv
        key: laya-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-laya-0.3.20

    - if: inputs.mode != 'warm-cache'
      id: venv-restore
      uses: actions/cache/restore@v6
      with:
        path: ~/laya-venv
        key: laya-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-laya-0.3.20

    - if: inputs.mode == 'warm-cache'
      uses: actions/cache@v6
      with:
        path: ~/.cache/huggingface
        key: laya-triage-models-9596364-6c2dad2

    - if: inputs.mode != 'warm-cache'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/huggingface
        key: laya-triage-models-9596364-6c2dad2

    - if: inputs.mode != 'warm-cache' && inputs.repo-memory == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/laya-triage
        key: laya-triage-memory-${{ github.run_id }}
        restore-keys: laya-triage-memory-

    - name: Install dependencies
      if: steps.venv-save.outputs.cache-hit != 'true' && steps.venv-restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv "$HOME/laya-venv"
        "$HOME/laya-venv/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
        "$HOME/laya-venv/bin/pip" install -r "${{ github.action_path }}/requirements.txt"

    - name: Download models
      if: inputs.mode == 'warm-cache'
      shell: bash
      run: '"$HOME/laya-venv/bin/python" "${{ github.action_path }}/modelos.py"'

    - name: Build repo memory
      if: inputs.mode == 'warm-cache' && inputs.repo-memory == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: '"$HOME/laya-venv/bin/python" "${{ github.action_path }}/memoria.py"'

    - if: inputs.mode == 'warm-cache' && inputs.repo-memory == 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/laya-triage
        key: laya-triage-memory-${{ github.run_id }}

    - name: Run triage
      if: inputs.mode != 'warm-cache'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LAYA_MODE: ${{ inputs.mode }}
        LAYA_DRY_RUN: ${{ inputs.dry-run }}
        LAYA_SPAM_CHECK: ${{ inputs.spam-check }}
        LAYA_CLASS_PRIORS: ${{ inputs.class-priors }}
        LAYA_LABELS: ${{ inputs.labels }}
        LAYA_BACKLOG_LIMIT: ${{ inputs.backlog-limit }}
        LAYA_REPO_MEMORY: ${{ inputs.repo-memory }}
      run: '"$HOME/laya-venv/bin/python" "${{ github.action_path }}/triage.py"'