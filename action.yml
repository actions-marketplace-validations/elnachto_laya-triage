name: "Laya Triage"
description: "Free, local AI triage for issues and pull requests using the open Laya decision model"
branding:
  icon: "tag"
  color: "purple"

inputs:
  mode:
    description: "Use 'triage' to classify issues and pull requests, or 'warm-cache' to download the models and save them in the cache"
    required: false
    default: "triage"
  github-token:
    description: "Token used to add labels and comments"
    required: false
    default: ${{ github.token }}
  dry-run:
    description: "When 'true', only print the decisions without changing the issue or pull request. Set it to 'false' to apply labels and comments"
    required: false
    default: "true"
  spam-check:
    description: "Experimental. When 'true', pull requests are checked for low-effort spam. Off by default because it still misses most spam"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      id: python
      with:
        python-version: "3.12"

    - if: inputs.mode == 'warm-cache'
      id: venv-save
      uses: actions/cache@v6
      with:
        path: ~/laya-venv
        key: laya-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-laya-0.3.20

    - if: inputs.mode != 'warm-cache'
      id: venv-restore
      uses: actions/cache/restore@v6
      with:
        path: ~/laya-venv
        key: laya-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-laya-0.3.20

    - if: inputs.mode == 'warm-cache'
      uses: actions/cache@v6
      with:
        path: ~/.cache/huggingface
        key: laya-triage-models-7d51458-cdb5ce1

    - if: inputs.mode != 'warm-cache'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/huggingface
        key: laya-triage-models-7d51458-cdb5ce1

    - name: Install dependencies
      if: steps.venv-save.outputs.cache-hit != 'true' && steps.venv-restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv "$HOME/laya-venv"
        "$HOME/laya-venv/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
        "$HOME/laya-venv/bin/pip" install -r "${{ github.action_path }}/requirements.txt"

    - name: Download models
      if: inputs.mode == 'warm-cache'
      shell: bash
      run: '"$HOME/laya-venv/bin/python" "${{ github.action_path }}/modelos.py"'

    - name: Run triage
      if: inputs.mode != 'warm-cache'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LAYA_DRY_RUN: ${{ inputs.dry-run }}
        LAYA_SPAM_CHECK: ${{ inputs.spam-check }}
      run: '"$HOME/laya-venv/bin/python" "${{ github.action_path }}/triage.py"'