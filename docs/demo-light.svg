<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<style>
.ciclo{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease}
.corriendo{animation-name:corriendo;opacity:0}
@keyframes corriendo{0%,14%{opacity:0}18%,44%{opacity:1}47%,100%{opacity:0}}
.listo{animation-name:listo;opacity:0}
@keyframes listo{0%,45%{opacity:0}49%,92%{opacity:1}97%,100%{opacity:0}}
.agrego{animation-name:agrego;opacity:0}
@keyframes agrego{0%,52%{opacity:0;transform:translateY(6px)}57%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
.ninguna{animation-name:ninguna}
@keyframes ninguna{0%,52%{opacity:1}54%,95%{opacity:0}100%{opacity:1}}
.chip{animation-name:chip;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes chip{0%,53%{opacity:0;transform:scale(.6)}57%{opacity:1;transform:scale(1.12)}60%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
.giro{animation:giro 1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes giro{to{transform:rotate(360deg)}}
</style>
<rect width="820" height="400" rx="16" fill="#F4F3EF"/>
<rect x="20" y="20" width="780" height="360" rx="12" fill="#FFFFFF" stroke="#E6E4EC"/>
<text x="48" y="66" font-size="22" font-weight="700" fill="#16141F">Login button does nothing on Safari 17 <tspan fill="#6E6A80" font-weight="400">#15</tspan></text>
<rect x="48" y="82" width="64" height="24" rx="12" fill="#2E9E68"/>
<text x="80" y="99" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Open</text>
<text x="124" y="99" font-size="13" fill="#6E6A80"><tspan font-weight="600" fill="#16141F">Cecilia</tspan> opened this issue</text>
<rect x="48" y="122" width="520" height="92" rx="8" fill="#F4F3EF" stroke="#E6E4EC"/>
<text font-size="13.5" fill="#16141F"><tspan x="64" y="150">Clicking Login on Safari 17.4 (macOS 14.5) does nothing.</tspan><tspan x="64" y="172">No error in the console, no network request.</tspan><tspan x="64" y="194">Works fine on Chrome and Firefox.</tspan></text>
<line x1="72" y1="214" x2="72" y2="350" stroke="#E6E4EC" stroke-width="2"/>
<g class="ciclo corriendo">
<circle cx="72" cy="248" r="13" fill="#FFFFFF" stroke="#E6E4EC"/>
<circle class="giro" cx="72" cy="248" r="6" fill="none" stroke="#C99A16" stroke-width="2.4" stroke-dasharray="26 12"/>
<text x="96" y="253" font-size="13.5" fill="#6E6A80"><tspan font-weight="600" fill="#16141F">laya-triage</tspan> is reading the issue…</text>
</g>
<g class="ciclo listo">
<circle cx="72" cy="248" r="13" fill="#2E9E68"/>
<path d="M66 248l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="253" font-size="13.5" fill="#6E6A80"><tspan font-weight="600" fill="#16141F">laya-triage</tspan> finished · bug, 93% confident</text>
</g>
<g class="ciclo agrego">
<circle cx="72" cy="296" r="13" fill="#FFFFFF" stroke="#E6E4EC"/>
<path d="M66 290h6l6 6-6 6-6-6z" fill="none" stroke="#6E6A80" stroke-width="1.6" stroke-linejoin="round"/>
<text x="96" y="301" font-size="13.5" fill="#6E6A80"><tspan font-weight="600" fill="#16141F">laya-triage</tspan> added the</text>
<rect x="246" y="285" width="44" height="22" rx="11" fill="#F2644B"/>
<text x="268" y="300.5" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">bug</text>
<text x="298" y="301" font-size="13.5" fill="#6E6A80">label</text>
</g>
<line x1="596" y1="46" x2="596" y2="354" stroke="#E6E4EC"/>
<text x="620" y="70" font-size="12.5" font-weight="600" fill="#6E6A80">Labels</text>
<text class="ciclo ninguna" x="620" y="96" font-size="13.5" fill="#6E6A80">None yet</text>
<g class="ciclo chip">
<rect x="620" y="82" width="48" height="24" rx="12" fill="#F2644B"/>
<text x="644" y="98.5" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">bug</text>
</g>
<line x1="620" y1="124" x2="776" y2="124" stroke="#E6E4EC"/>
<text x="620" y="150" font-size="12.5" font-weight="600" fill="#6E6A80">Assignees</text>
<text x="620" y="176" font-size="13.5" fill="#6E6A80">No one</text>
<text x="776" y="368" font-size="11" fill="#6E6A80" text-anchor="end">Sped up · real run takes about 30 s</text>
</svg>